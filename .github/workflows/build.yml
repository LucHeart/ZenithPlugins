name: Build

on:
  push:
    # other branches get built through their pull request
    branches: [master]
    # one plugin per release: <Plugin>/<version>, e.g. ZenithVoice/1.0.1
    tags: ["*/[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      mc: ${{ steps.read.outputs.mc }}
      plugin: ${{ steps.tag.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
      # fail a release tag right away instead of after every jar has been built
      - name: Check tag matches the plugin's plugin_version
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          plugin="${GITHUB_REF_NAME%%/*}"
          tag_version="${GITHUB_REF_NAME#*/}"
          if [ ! -f "$plugin/gradle.properties" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't name a plugin directory"
            exit 1
          fi
          version=$(grep '^plugin_version=' "$plugin/gradle.properties" | cut -d= -f2 | tr -d '\r ')
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match plugin_version=$version in $plugin/gradle.properties"
            exit 1
          fi
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
      # mc_versions in gradle.properties is the single list of MC versions to build
      - id: read
        run: |
          list=$(grep '^mc_versions=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "mc=$(jq -cn --arg l "$list" '$l | split(",") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.mc) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # a release tag only builds its own plugin
      - run: ./gradlew ${{ needs.versions.outputs.plugin && format(':{0}:build', needs.versions.outputs.plugin) || 'build' }} -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: Zenith*/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: [versions, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: jars/**/${{ needs.versions.outputs.plugin }}-*.jar
          generate_release_notes: true
          # published by hand after checking it
          draft: true
