# Shared by every plugin. Per plugin settings (plugin_version, plugin_id, ...) are in <Plugin>/gradle.properties

# Must match the MC version of your ZenithProxy install: https://wiki.2b2t.vc/Setup/#release-channels
# Build another one with ./gradlew build -Pmc=1.21.4
mc=26.3.0
# Every MC version CI builds jars for
mc_versions=1.21.4,26.2.0,26.3.0
# ZenithProxy release to compile against, or "snapshot" for the latest <mc>-SNAPSHOT build
zenith_version=3.7.3

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
